_metadata:
  major_version: 1
display_information:
  name: KSC Disney Topping Update
  description: Sends scheduled end-of-day Disney bin checks and shares restock results.
  background_color: "#FFA8BD"
features:
  bot_user:
    display_name: KSC Topping Update
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - files:write
      - chat:write.public
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
